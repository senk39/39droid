name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (platforma 37, build-tools 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Testy i budowanie
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: 39droid-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
